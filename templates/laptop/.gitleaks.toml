# Secret scanning for this harness.
#
# This harness ships a sensor that catches committed private keys, and a
# sensor's negative controls have to be the literal bytes its check greps for,
# one per branch of the check, or the branch is dead while the sensor still
# reports live. So config/sensors/no-private-key.json carries four PEM private
# key headers, and a pattern scanner reads every one as a leak.
#
# The stock private-key rule is switched off here, and it is replaced rather
# than dropped: `trunnion scan-keys .` reads every file in this harness and fails
# on a PEM block whose base64 body decodes to 48 bytes or more, that being a
# PKCS8 ed25519 key and the smallest real private key there is. Run it in the
# same gate that runs the rest of this harness's checks. An exemption with
# nothing behind it is a green board, which is the failure this system exists
# to prevent.
#
# The rule is disabled rather than the sensor path allowlisted on purpose: a
# gitleaks path allowlist applies to every rule, so allowlisting the sensor
# directory would also stop a provider token being found in it. Only private
# key detection is handed over; everything else stays live everywhere.

title = "harness"

[extend]
useDefault = true
disabledRules = ["private-key"]

# config/actor-key.seed is this harness's own signing seed, generated by
# trunnion template init and never shipped in a template. It is raw hex rather
# than PEM, so nothing above touches it. It is real key material: it belongs in
# .gitignore, not in an allowlist, and if it leaks the fix is to generate a new
# harness key and update config/actor-keys.json and the attestation block in
# config/policy.json.
