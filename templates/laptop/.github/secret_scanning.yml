# GitHub secret scanning for this harness. Same exemption as .gitleaks.toml
# and for the same reason: the no-private-key sensor's negative controls have
# to be the literal bytes its check greps for, one per branch, or the branch is
# dead while the sensor reports live. Every block in that file is a truncated
# header with no key body.
#
# The exemption is not the whole story. `trunnion scan-keys .` reads every file
# in this harness, not only the path below, and fails on a PEM block whose body
# decodes to 48 bytes or more, which is a PKCS8 ed25519 key and the smallest
# real one there is. Wire it into whatever gate runs this harness's checks.
paths-ignore:
  - "config/sensors/*.json"
