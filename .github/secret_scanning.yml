# GitHub secret scanning. Same exemptions as .gitleaks.toml and for the same
# reason: the `no-private-key` sensor's negative controls have to be the
# literal bytes its check greps for, one per branch, or the branch is dead
# while the sensor reports live. Every block in these paths is a truncated
# header with no key body.
#
# The exemption is not the whole story. `trunnion scan-keys .` runs on every
# push, reads every file in the tree rather than only these, and fails on
# a PEM block whose body decodes to 48 bytes or more, which is a PKCS8 ed25519
# key and the smallest real one there is. Adding a path here without that
# holding still fails CI.
paths-ignore:
  - "templates/laptop/config/sensors/no-private-key.json"
  - "docs/proof/fixtures/*.json"
  - "docs/proof/05-run.sh"
  - "docs/proof/06-run.sh"
  - "src/sensor.rs"
  - "tests/sensor.rs"
  - "tests/trust.rs"
