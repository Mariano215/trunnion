<svg xmlns="http://www.w3.org/2000/svg" width="749" height="727" viewBox="0 0 749 727" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" role="img" aria-label="A terminal session: trunnion refuses a destructive tool call, then detects one altered event on the ledger"><style>text{white-space:pre}</style><rect width="749" height="727" rx="8" fill="#080d16"/><path d="M0 8a8 8 0 0 1 8-8h733a8 8 0 0 1 8 8v22H0z" fill="#101a2b"/><line x1="0" y1="30" x2="749" y2="30" stroke="#1b2841"/><circle cx="24" cy="15" r="5" fill="#3b4763"/><circle cx="40" cy="15" r="5" fill="#3b4763"/><circle cx="56" cy="15" r="5" fill="#3b4763"/><text x="374" y="19" fill="#64748f" font-size="11" text-anchor="middle">trunnion</text><style>.r0{animation:a0 21.01s infinite}@keyframes a0{0%,0.0%{opacity:0}0.01%,100%{opacity:1}}#w0 rect{animation:t0 21.01s infinite linear}@keyframes t0{0%,0.0%{transform:scaleX(0)}7.663%,100%{transform:scaleX(1)}}.r1{animation:a1 21.01s infinite}@keyframes a1{0%,9.329%{opacity:0}9.339%,100%{opacity:1}}.r2{animation:a2 21.01s infinite}@keyframes a2{0%,16.23%{opacity:0}16.240000000000002%,100%{opacity:1}}.r3{animation:a3 21.01s infinite}@keyframes a3{0%,20.038%{opacity:0}20.048000000000002%,100%{opacity:1}}#w3 rect{animation:t3 21.01s infinite linear}@keyframes t3{0%,20.038%{transform:scaleX(0)}30.366%,100%{transform:scaleX(1)}}.r4{animation:a4 21.01s infinite}@keyframes a4{0%,32.032%{opacity:0}32.041999999999994%,100%{opacity:1}}.r5{animation:a5 21.01s infinite}@keyframes a5{0%,32.27%{opacity:0}32.28%,100%{opacity:1}}.r6{animation:a6 21.01s infinite}@keyframes a6{0%,32.508%{opacity:0}32.518%,100%{opacity:1}}.r7{animation:a7 21.01s infinite}@keyframes a7{0%,32.746%{opacity:0}32.756%,100%{opacity:1}}.r8{animation:a8 21.01s infinite}@keyframes a8{0%,32.984%{opacity:0}32.994%,100%{opacity:1}}.r9{animation:a9 21.01s infinite}@keyframes a9{0%,39.886%{opacity:0}39.896%,100%{opacity:1}}.r10{animation:a10 21.01s infinite}@keyframes a10{0%,43.693%{opacity:0}43.702999999999996%,100%{opacity:1}}#w10 rect{animation:t10 21.01s infinite linear}@keyframes t10{0%,43.693%{transform:scaleX(0)}51.69%,100%{transform:scaleX(1)}}.r11{animation:a11 21.01s infinite}@keyframes a11{0%,53.356%{opacity:0}53.366%,100%{opacity:1}}.r12{animation:a12 21.01s infinite}@keyframes a12{0%,53.594%{opacity:0}53.604%,100%{opacity:1}}.r13{animation:a13 21.01s infinite}@keyframes a13{0%,53.832%{opacity:0}53.842%,100%{opacity:1}}.r14{animation:a14 21.01s infinite}@keyframes a14{0%,54.069%{opacity:0}54.079%,100%{opacity:1}}.r15{animation:a15 21.01s infinite}@keyframes a15{0%,60.971%{opacity:0}60.980999999999995%,100%{opacity:1}}.r16{animation:a16 21.01s infinite}@keyframes a16{0%,64.779%{opacity:0}64.789%,100%{opacity:1}}#w16 rect{animation:t16 21.01s infinite linear}@keyframes t16{0%,64.779%{transform:scaleX(0)}73.108%,100%{transform:scaleX(1)}}.r17{animation:a17 21.01s infinite}@keyframes a17{0%,74.774%{opacity:0}74.784%,100%{opacity:1}}.r18{animation:a18 21.01s infinite}@keyframes a18{0%,75.012%{opacity:0}75.022%,100%{opacity:1}}.r19{animation:a19 21.01s infinite}@keyframes a19{0%,75.25%{opacity:0}75.26%,100%{opacity:1}}.r20{animation:a20 21.01s infinite}@keyframes a20{0%,75.488%{opacity:0}75.498%,100%{opacity:1}}.r21{animation:a21 21.01s infinite}@keyframes a21{0%,75.726%{opacity:0}75.736%,100%{opacity:1}}.r22{animation:a22 21.01s infinite}@keyframes a22{0%,75.964%{opacity:0}75.974%,100%{opacity:1}}.r23{animation:a23 21.01s infinite}@keyframes a23{0%,76.202%{opacity:0}76.212%,100%{opacity:1}}.r24{animation:a24 21.01s infinite}@keyframes a24{0%,76.44%{opacity:0}76.45%,100%{opacity:1}}.r25{animation:a25 21.01s infinite}@keyframes a25{0%,76.678%{opacity:0}76.688%,100%{opacity:1}}.r26{animation:a26 21.01s infinite}@keyframes a26{0%,76.916%{opacity:0}76.926%,100%{opacity:1}}.r27{animation:a27 21.01s infinite}@keyframes a27{0%,77.154%{opacity:0}77.164%,100%{opacity:1}}.r28{animation:a28 21.01s infinite}@keyframes a28{0%,77.392%{opacity:0}77.402%,100%{opacity:1}}.r29{animation:a29 21.01s infinite}@keyframes a29{0%,77.63%{opacity:0}77.64%,100%{opacity:1}}.r30{animation:a30 21.01s infinite}@keyframes a30{0%,77.868%{opacity:0}77.878%,100%{opacity:1}}.r31{animation:a31 21.01s infinite}@keyframes a31{0%,78.106%{opacity:0}78.116%,100%{opacity:1}}.r32{animation:a32 21.01s infinite}@keyframes a32{0%,78.344%{opacity:0}78.354%,100%{opacity:1}}.r33{animation:a33 21.01s infinite}@keyframes a33{0%,78.582%{opacity:0}78.592%,100%{opacity:1}}.r34{animation:a34 21.01s infinite}@keyframes a34{0%,78.82%{opacity:0}78.83%,100%{opacity:1}}</style><g opacity="1"><clipPath id="w0" clipPathUnits="userSpaceOnUse"><rect x="31.6" y="46" width="358.8" height="19" style="transform-origin:31.6px 0px"/></clipPath><text class="r0" x="16" y="59" fill="#3b90ff">$</text><g clip-path="url(#w0)"><text class="r0" x="31.6" y="59" fill="#e3e9f4" textLength="358.8" lengthAdjust="spacingAndGlyphs">trunnion ledger init /tmp/trunnion-cast/ledger</text></g><text class="r1" x="16" y="78" fill="#e3e9f4" textLength="366.6" lengthAdjust="spacingAndGlyphs">ledger initialised at /tmp/trunnion-cast/ledger</text><text class="r2" x="16" y="97" fill="#64748f" textLength="351.0" lengthAdjust="spacingAndGlyphs"># ask the broker to run something destructive</text><clipPath id="w3" clipPathUnits="userSpaceOnUse"><rect x="31.6" y="103" width="483.6" height="19" style="transform-origin:31.6px 0px"/></clipPath><text class="r3" x="16" y="116" fill="#3b90ff">$</text><g clip-path="url(#w3)"><text class="r3" x="31.6" y="116" fill="#e3e9f4" textLength="483.6" lengthAdjust="spacingAndGlyphs">trunnion broker call /tmp/trunnion-cast/ledger Bash "rm -rf /"</text></g><text class="r4" x="16" y="135" fill="#ff5f5a" textLength="694.2" lengthAdjust="spacingAndGlyphs">policy denied Bash on rm -rf /: rule r-destructive-shell fired and the decision is on the</text><text class="r5" x="16" y="154" fill="#e3e9f4" textLength="709.8" lengthAdjust="spacingAndGlyphs">ledger. Fix: This command is destructive and its capability's rollback handle cannot recall</text><text class="r6" x="16" y="173" fill="#e3e9f4" textLength="663.0" lengthAdjust="spacingAndGlyphs">it. Scope the deletion to a path the run owns, or route it through a capability whose</text><text class="r7" x="16" y="192" fill="#e3e9f4" textLength="226.2" lengthAdjust="spacingAndGlyphs">rollback genuinely covers it.</text><text class="r8" x="16" y="211" fill="#e3e9f4" textLength="327.6" lengthAdjust="spacingAndGlyphs">refusal recorded (ledger sealed at size 8)</text><text class="r9" x="16" y="230" fill="#64748f" textLength="522.6" lengthAdjust="spacingAndGlyphs"># the record is checkable without trusting the binary that wrote it</text><clipPath id="w10" clipPathUnits="userSpaceOnUse"><rect x="31.6" y="236" width="374.4" height="19" style="transform-origin:31.6px 0px"/></clipPath><text class="r10" x="16" y="249" fill="#3b90ff">$</text><g clip-path="url(#w10)"><text class="r10" x="31.6" y="249" fill="#e3e9f4" textLength="374.4" lengthAdjust="spacingAndGlyphs">trunnion ledger verify /tmp/trunnion-cast/ledger</text></g><text class="r11" x="16" y="268" fill="#e3e9f4" textLength="78.0" lengthAdjust="spacingAndGlyphs">entries: 8</text><text class="r12" x="16" y="287" fill="#e3e9f4" textLength="429.0" lengthAdjust="spacingAndGlyphs">attestations verified against config/actor-keys.json: 8</text><text class="r13" x="16" y="306" fill="#e3e9f4" textLength="702.0" lengthAdjust="spacingAndGlyphs">of those, 8 were signed under a key whose seed is published, so they prove which run wrote</text><text class="r14" x="16" y="325" fill="#e3e9f4" textLength="686.4" lengthAdjust="spacingAndGlyphs">the event and not who operated it; a deployment registers its own key and keeps the seed</text><text class="r15" x="16" y="344" fill="#64748f" textLength="452.4" lengthAdjust="spacingAndGlyphs"># now copy the ledger and alter one character of one event</text><clipPath id="w16" clipPathUnits="userSpaceOnUse"><rect x="31.6" y="350" width="390.0" height="19" style="transform-origin:31.6px 0px"/></clipPath><text class="r16" x="16" y="363" fill="#3b90ff">$</text><g clip-path="url(#w16)"><text class="r16" x="31.6" y="363" fill="#e3e9f4" textLength="390.0" lengthAdjust="spacingAndGlyphs">trunnion ledger verify /tmp/trunnion-cast/tampered</text></g><text class="r17" x="16" y="382" fill="#e3e9f4" textLength="78.0" lengthAdjust="spacingAndGlyphs">entries: 8</text><text class="r18" x="16" y="401" fill="#e3e9f4" textLength="429.0" lengthAdjust="spacingAndGlyphs">attestations verified against config/actor-keys.json: 7</text><text class="r19" x="16" y="420" fill="#e3e9f4" textLength="702.0" lengthAdjust="spacingAndGlyphs">of those, 7 were signed under a key whose seed is published, so they prove which run wrote</text><text class="r20" x="16" y="439" fill="#e3e9f4" textLength="686.4" lengthAdjust="spacingAndGlyphs">the event and not who operated it; a deployment registers its own key and keeps the seed</text><text class="r21" x="16" y="458" fill="#ff3b40" textLength="702.0" lengthAdjust="spacingAndGlyphs">entry 4 (run-1786546082357-4): chain diverges between entry 4 and entry 5: entry 5 records</text><text class="r22" x="16" y="477" fill="#e3e9f4" textLength="702.0" lengthAdjust="spacingAndGlyphs">prev_hash Some("sha256:6023a9c3da596b01f047ab3650bf6aa05f2031546ce54f53570c12604601e5e5"),</text><text class="r23" x="16" y="496" fill="#e3e9f4" textLength="265.2" lengthAdjust="spacingAndGlyphs">recomputed leaf hash of entry 4 is</text><text class="r24" x="16" y="515" fill="#e3e9f4" textLength="709.8" lengthAdjust="spacingAndGlyphs">Some("sha256:d5081eafc572a54c50e08cb49c1b3746afdb8b1e25cfbc88cf6de5f8d7ff394d"). Fix: entry</text><text class="r25" x="16" y="534" fill="#e3e9f4" textLength="413.4" lengthAdjust="spacingAndGlyphs">4 was altered after append; restore it from a replica</text><text class="r26" x="16" y="553" fill="#ff3b40" textLength="655.2" lengthAdjust="spacingAndGlyphs">entry 4 (run-1786546082357-4): Merkle root diverges first at tree size 5: recomputed</text><text class="r27" x="16" y="572" fill="#e3e9f4" textLength="694.2" lengthAdjust="spacingAndGlyphs">sha256:fca74544bc70b136d98fda4104167cb39b65eed76d488ba296272333c8e7cce8, signed head says</text><text class="r28" x="16" y="591" fill="#e3e9f4" textLength="709.8" lengthAdjust="spacingAndGlyphs">sha256:a084453c7d0eaf587570e6c443175c06e6dad3a343aca3535addd751185489b8. Newest entry under</text><text class="r29" x="16" y="610" fill="#e3e9f4" textLength="670.8" lengthAdjust="spacingAndGlyphs">that head is entry 4 (id run-1786546082357-4). Fix: restore entry 4 from a replica and</text><text class="r30" x="16" y="629" fill="#e3e9f4" textLength="70.2" lengthAdjust="spacingAndGlyphs">re-verify</text><text class="r31" x="16" y="648" fill="#ff3b40" textLength="717.6" lengthAdjust="spacingAndGlyphs">entry 4 (run-1786546082357-4): entry 4 (id run-1786546082357-4) carries an attestation under</text><text class="r32" x="16" y="667" fill="#e3e9f4" textLength="709.8" lengthAdjust="spacingAndGlyphs">registered key ed25519:407d778d0d4ca380 that does not verify. Fix: the envelope was altered</text><text class="r33" x="16" y="686" fill="#e3e9f4" textLength="717.6" lengthAdjust="spacingAndGlyphs">after signing, or the attestation was forged; restore the entry from a replica or revoke the</text><text class="r34" x="16" y="705" fill="#e3e9f4" textLength="23.4" lengthAdjust="spacingAndGlyphs">key</text></g></svg>
